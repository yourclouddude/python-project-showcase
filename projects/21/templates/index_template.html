<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ headline }}"><title>{{ name }} - Portfolio</title><style>body{font-family:system-ui;max-width:920px;margin:auto;padding:2rem;line-height:1.6;color:#17233b}header{border-bottom:3px solid #4464ad}section{margin:2rem 0}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}article{padding:1.3rem;background:#edf2fa;border-radius:12px}a{color:#214494}a:focus{outline:3px solid #214494}</style></head><body><header><h1>{{ name }}</h1><p>{{ headline }}</p><nav aria-label="Main"><a href="#about">About</a> | <a href="#projects">Projects</a></nav></header><main><section id="about"><h2>About</h2><p>{{ about }}</p></section><section id="projects"><h2>Projects</h2><div class="projects">{% for project in projects %}<article><h3>{{ project.title }}</h3><p>{{ project.description }}</p><a href="{{ project.url }}">View {{ project.title }}</a></article>{% endfor %}</div></section></main><footer>Generated locally with Python and Jinja2.</footer></body></html>
